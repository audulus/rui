[package]
name = "rui_macros"
description = "Procedural macros for rui"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/audulus/rui"
edition = "2024"
rust-version = "1.88"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
