[workspace]
resolver = "3"
members = [".", "./macros", "./examples/flip_cards", "./examples/calculator", "./examples/synth"]
default-members = ["."]

[workspace.dependencies]
rui = { path = "." }

[package]
name = "rui"
description = "Experimental Declarative UI library"
version = "0.7.0"
license = "MIT"
readme = "README.md"
authors = ["Taylor Holliday <rui@audulus.com>"]
keywords = ["ui", "gui", "declarative"]
categories = ["gui"]
repository = "https://github.com/audulus/rui"
edition = "2024"
rust-version = "1.88"
exclude = [ "screenshots/*" ]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = [ "winit" ]

[dependencies]
euclid = "0.22.7"
wgpu = "0.20.0"
futures = "0.3"
vger = "0.3"
accesskit = "0.16.0"
winit = { version = "0.30", optional = true }
log = "0.4"
dyn-clone = "1.0.17"
rui_macros = { version = "0.1.0", path = "macros" }

# Seems we can't publish to crates.io with this dependency.
# baseview = { git = "https://github.com/RustAudio/baseview", optional = true }

[dev-dependencies]
insta = "1.40"
png = "0.17"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.76"
web-sys = { version = "^0.3.61", features = ["Location"] }
console_log = "1"
console_error_panic_hook = "0.1.6"
